# CI automatica del progetto A.C.T.D. (v1.1.5) — Priorità 1 approvata dall'autore.
# Ambiente: ubuntu-latest con Python 3.11. Ogni job riparte da checkout e
# setup Python, poi esegue il proprio controllo in modo indipendente.
name: ACTD CI tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 1) Controllo di sintassi del monolite tramite py_compile.
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Controllo sintassi py_compile
        run: python -m py_compile actd_build/auto_copy_transforms_def.py

  # 2) Round-trip build: rigenera il monolite dai moduli e verifica che il
  #    risultato sia identico a quello committato (diff vuoto => exit 0).
  build-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build round-trip del monolite
        run: python packaging/build_monolith.py build
      - name: Nessuna differenza sul monolite generato
        run: git diff --exit-code -- actd_build/auto_copy_transforms_def.py

  # 3) Verifica versione: la coerenza tra packaging/version.json,
  #    actd_header.py e blender_manifest.toml e' gia' garantita da
  #    verifica_versione() in packaging/build_monolith.py (invoicata anche
  #    dalla build del job precedente). Questo job la esercita direttamente
  #    importando la logica del progetto, senza riscrivere il monolite.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Coerenza versione (logica di build_monolith.py)
        run: python -c "import sys; sys.path.insert(0, 'packaging'); import build_monolith; build_monolith.verifica_versione()"

  # 4) Verifica manifest: il manifest Blender deve dichiarare il minimo
  #    4.2.0 e il tipo add-on.
  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Campi obbligatori di packaging/blender_manifest.toml
        run: |
          grep -Eq '^blender_version_min *= *"4\.2\.0"' packaging/blender_manifest.toml
          grep -Eq '^type *= *"add-on"' packaging/blender_manifest.toml
          echo "manifest OK: blender_version_min=4.2.0, type=add-on"
