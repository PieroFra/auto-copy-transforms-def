# Workflow di rilascio del progetto A.C.T.D. (Priorità 3 approvata dall'autore).
# Unico workflow di release del progetto: consolida la logica del soppresso
# release.yml e sostituisce il precedente contenuto di questo file (che si
# attivava al push di un tag e pubblicava solo ZIP+SHA256 senza Blender).
# Ambiente: ubuntu-latest con Python 3.11 e PowerShell (pwsh, preinstallato sui
# runner GitHub). Attivato manualmente: l'autore inserisce la versione e, opzionale,
# il file delle note. Come da checklist, ogni rilascio incrementale usa un tag nuovo.
name: ACTD release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da rilasciare (es. 1.1.6); deve coincidere con packaging/version.json'
        required: true
        type: string
      notes_file:
        description: 'File delle note di rilascio (default: CHANGELOG.md)'
        required: false
        default: 'CHANGELOG.md'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Permesso necessario per creare il tag Git e la GitHub Release tramite gh.
    permissions:
      contents: write
    steps:
      # a) Checkout del repository (branch di default del dispatch).
      - name: Checkout del repository
        uses: actions/checkout@v4

      # b) Setup: Python 3.11 per gli script di build; pwsh e' gia' presente sui
      #    runner ubuntu-latest, questo step ne verifica la disponibilita'.
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifica disponibilita' PowerShell (pwsh)
        shell: bash
        run: pwsh --version

      # c) Controlli CI: round-trip build del monolite dai moduli e verifica che
      #    il risultato sia identico a quello committato (diff vuoto => exit 0).
      - name: Build round-trip del monolite
        run: python packaging/build_monolith.py build
      - name: Nessuna differenza sul monolite generato
        run: git diff --exit-code -- actd_build/auto_copy_transforms_def.py

      # d) Verifica versione: verifica_versione() in build_monolith.py confronta
      #    packaging/version.json, actd_header.py e blender_manifest.toml. La build
      #    del passo c) fallirebbe gia' in caso di divergenza; questo step la isola
      #    per una diagnosi chiara senza riscrivere il monolite.
      - name: Coerenza versione (version.json, actd_header.py, manifest)
        run: python -c "import sys; sys.path.insert(0, 'packaging'); import build_monolith; build_monolith.verifica_versione()"

      # e) Build release: esegue packaging/build_release.ps1 via pwsh, che funziona
      #    anche su Linux. Produce ZIP, RAR e SHA256.txt in dist/. Nota: lo script
      #    richiede Blender e rar.exe/WinRAR nel runner (o passati come parametri
      #    -Blender / -Rar) e genera i nomi degli artefatti dalla sua versione interna.
      - name: Build release (ZIP, RAR, SHA256 in dist)
        shell: bash
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/build_release.ps1

      # f) Verifica artefatti: dist/ deve contenere lo ZIP e il file SHA256 (oltre
      #    al RAR); ogni hash ricalcolato deve corrispondere a quello registrato
      #    nel file (formato "<hash> *<nome>").
      - name: Verifica artefatti in dist (presenza e coerenza hash)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist'
          if (-not (Get-ChildItem -LiteralPath $dist -Filter 'auto_copy_transforms_def-*.zip')) { throw 'Artefatto ZIP non trovato in dist' }
          if (-not (Get-ChildItem -LiteralPath $dist -Filter 'Auto_Copy_Transforms_DEF_*.rar')) { throw 'Artefatto RAR non trovato in dist' }
          $shaFile = Join-Path $dist 'SHA256.txt'
          if (-not (Test-Path -LiteralPath $shaFile)) { throw 'File SHA256.txt non trovato in dist' }
          foreach ($riga in Get-Content -LiteralPath $shaFile) {
            if ([string]::IsNullOrWhiteSpace($riga)) { continue }
            $parti = $riga -split ' \*', 2
            $atteso = $parti[0].Trim().ToLowerInvariant()
            $nome = $parti[1].Trim()
            $calcolato = (Get-FileHash -LiteralPath (Join-Path $dist $nome) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($calcolato -ne $atteso) { throw "Hash non corrispondente per $nome: $calcolato (atteso $atteso)" }
          }
          Write-Host "Artefatti OK: ZIP e RAR presenti, hash SHA256.txt verificati."

      # g) Crea il tag Git vX.Y.Z dalla versione in input (eventuale "v" iniziale
      #    normalizzato) e lo pusha: un tag gia' esistente fa fallire il passo.
      - name: Crea e pusha tag Git (vX.Y.Z)
        shell: bash
        env:
          VERSIONE: ${{ github.event.inputs.version }}
        run: |
          VERSIONE="${VERSIONE#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSIONE}"
          git push origin "v${VERSIONE}"

      # h) Crea GitHub Release con asset ZIP/RAR/SHA256 e note dal file indicato
      #    (default CHANGELOG.md, con fallback se il file indicato manca). I nomi
      #    degli asset sono in glob perche' li genera build_release.ps1.
      - name: Crea GitHub Release con asset e note
        shell: bash
        env:
          VERSIONE: ${{ github.event.inputs.version }}
          NOTE_FILE: ${{ github.event.inputs.notes_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONE="${VERSIONE#v}"
          NOTE="$NOTE_FILE"
          if [ -z "$NOTE" ] || [ ! -f "$NOTE" ]; then NOTE="CHANGELOG.md"; fi
          gh release create "v${VERSIONE}" \
            "dist/auto_copy_transforms_def-${VERSIONE}.zip" \
            "dist/Auto_Copy_Transforms_DEF_${VERSIONE}.rar" \
            "dist/SHA256.txt" \
            --title "A.C.T.D. v${VERSIONE}" \
            --notes-file "$NOTE"
