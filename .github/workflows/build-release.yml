# Workflow di rilascio del progetto A.C.T.D. (Priorità 3 approvata dall'autore).
# Unico workflow di release del progetto: consolida la logica del soppresso
# release.yml e sostituisce il precedente contenuto di questo file (che si
# attivava al push di un tag e pubblicava solo ZIP+SHA256 senza Blender).
# Ambiente: ubuntu-latest con Python 3.11 e PowerShell (pwsh, preinstallato sui
# runner GitHub). Attivato manualmente: l'autore inserisce la versione e, opzionale,
# il file delle note. Come da checklist, ogni rilascio incrementale usa un tag nuovo.
name: ACTD release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da rilasciare (es. 1.1.6); deve coincidere con packaging/version.json'
        required: true
        type: string
      notes_file:
        description: 'File delle note di rilascio (default: CHANGELOG.md)'
        required: false
        default: 'CHANGELOG.md'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Permesso necessario per creare il tag Git e la GitHub Release tramite gh.
    permissions:
      contents: write
    steps:
      # a) Checkout del repository (branch di default del dispatch).
      - name: Checkout del repository
        uses: actions/checkout@v4

      # b) Setup: Python 3.11 per gli script di build; pwsh e' gia' presente sui
      #    runner ubuntu-latest, questo step ne verifica la disponibilita'.
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verifica disponibilita' PowerShell (pwsh)
        shell: bash
        run: pwsh --version

      # c) Controlli CI: round-trip build del pacchetto generato dai moduli e
      #    verifica che il risultato sia identico a quello committato (diff
      #    vuoto => exit 0).
      - name: Build round-trip del pacchetto generato
        run: python packaging/build_package.py build
      - name: Nessuna differenza su pacchetto e moduli
        run: git diff --exit-code -- actd_build/auto_copy_transforms_def actd_build/actd_mods

      # d) Verifica versione: verifica_versione() in build_package.py confronta
      #    packaging/version.json, actd_header.py e blender_manifest.toml. La build
      #    del passo c) fallirebbe gia' in caso di divergenza; questo step la isola
      #    per una diagnosi chiara senza rigenerare il pacchetto.
      - name: Coerenza versione (version.json, actd_header.py, manifest)
        run: python -c "import sys; sys.path.insert(0, 'packaging'); import build_package; build_package.verifica_versione()"

      # d2) Provision Blender 5.2 (tarball ufficiale Linux x64) in $HOME/blender:
      #     gli script di packaging accettano il percorso dell'eseguibile tramite
      #     il parametro -Blender, quindi nessun percorso Windows e' necessario.
      - name: Scarica ed estrae Blender 5.2.0 (Linux x64)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz"
          TARBALL="$HOME/blender-5.2.0-linux-x64.tar.xz"
          curl -fL --retry 3 -o "$TARBALL" "$URL"
          mkdir -p "$HOME/blender"
          tar -xJf "$TARBALL" -C "$HOME/blender"
          rm -f "$TARBALL"
          BLENDER_BIN="$HOME/blender/blender-5.2.0-linux-x64/blender"
          "$BLENDER_BIN" --version

      # e) Build release: esegue packaging/build_release.ps1 via pwsh, che funziona
      #    anche su Linux. Produce ZIP e SHA256.txt in dist/; il RAR e' opzionale
      #    (-SkipRar) e resta una prerogativa della build locale su Windows, dove
      #    rar.exe/WinRAR sono disponibili. Blender 5.2 e' provisionato dal passo
      #    precedente e passato esplicitamente con -Blender.
      - name: Build release (ZIP + SHA256 in dist; RAR saltato in CI)
        shell: bash
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/build_release.ps1 -SkipRar -Blender "$HOME/blender/blender-5.2.0-linux-x64/blender"

      # f) Verifica artefatti: dist/ deve contenere lo ZIP e il file SHA256 (in CI
      #    il RAR non viene generato per via di -SkipRar); ogni hash ricalcolato
      #    deve corrispondere a quello registrato nel file (formato "<hash> *<nome>").
      - name: Verifica artefatti in dist (presenza e coerenza hash)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist'
          if (-not (Get-ChildItem -LiteralPath $dist -Filter 'auto_copy_transforms_def-*.zip')) { throw 'Artefatto ZIP non trovato in dist' }
          if (Get-ChildItem -LiteralPath $dist -Filter 'Auto_Copy_Transforms_DEF_*.rar') { throw 'In CI non deve essere generato alcun RAR (-SkipRar)' }
          $shaFile = Join-Path $dist 'SHA256.txt'
          if (-not (Test-Path -LiteralPath $shaFile)) { throw 'File SHA256.txt non trovato in dist' }
          foreach ($riga in Get-Content -LiteralPath $shaFile) {
            if ([string]::IsNullOrWhiteSpace($riga)) { continue }
            $parti = $riga -split ' \*', 2
            $atteso = $parti[0].Trim().ToLowerInvariant()
            $nome = $parti[1].Trim()
            $calcolato = (Get-FileHash -LiteralPath (Join-Path $dist $nome) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($calcolato -ne $atteso) { throw "Hash non corrispondente per ${nome}: $calcolato (atteso $atteso)" }
          }
          Write-Host "Artefatti OK: ZIP e SHA256.txt presenti, hash verificati."

      # g) Crea il tag Git vX.Y.Z dalla versione in input (eventuale "v" iniziale
      #    normalizzato) e lo pusha: un tag gia' esistente fa fallire il passo.
      - name: Crea e pusha tag Git (vX.Y.Z)
        shell: bash
        env:
          VERSIONE: ${{ github.event.inputs.version }}
        run: |
          VERSIONE="${VERSIONE#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSIONE}"
          git push origin "v${VERSIONE}"

      # h) Crea GitHub Release con asset ZIP/SHA256 e note dal file indicato
      #    (default CHANGELOG.md, con fallback se il file indicato manca). Il nome
      #    dello ZIP e' in glob perche' lo genera build_release.ps1 con la sua
      #    versione interna; in CI il RAR non esiste (-SkipRar).
      - name: Crea GitHub Release con asset e note
        shell: bash
        env:
          VERSIONE: ${{ github.event.inputs.version }}
          NOTE_FILE: ${{ github.event.inputs.notes_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONE="${VERSIONE#v}"
          NOTE="$NOTE_FILE"
          if [ -z "$NOTE" ] || [ ! -f "$NOTE" ]; then NOTE="CHANGELOG.md"; fi
          gh release create "v${VERSIONE}" \
            dist/auto_copy_transforms_def-*.zip \
            dist/SHA256.txt \
            --title "A.C.T.D. v${VERSIONE}" \
            --notes-file "$NOTE"
